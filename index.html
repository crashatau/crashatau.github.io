<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Physics Simulator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-container">
        <canvas id="gameCanvas" width="800" height="600"></canvas>
        <div class="toolbar">
            <h3>Materials</h3>
            <div class="material-buttons">
                <button id="sandBtn" class="material-btn active" data-material="sand">Sand</button>
                <button id="waterBtn" class="material-btn" data-material="water">Water</button>
                <button id="acidBtn" class="material-btn" data-material="acid">Acid</button>
                <button id="lavaBtn" class="material-btn" data-material="lava">Lava</button>
                <button id="wallBtn" class="material-btn" data-material="wall">Wall</button>
            </div>
            <div class="controls">
                <button id="clearBtn">Clear All</button>
                <button id="resetBtn">Reset</button>
            </div>
            <div class="slider-container">
                <span>Cell Size: <span id="cellSizeValue">5</span></span>
                <input type="range" id="cellSizeSlider" min="1" max="20" value="5">
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
